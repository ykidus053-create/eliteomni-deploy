name: EliteOmni Quality Gate V30

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-v30-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
      PYTHONPATH: ${{ github.workspace }}
      ELITE_REQUIRED_ENV: ""
      ELITE_ADMIN_TOKEN: "ci-only-token-that-is-long-enough-0001"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python scripts/install_requirements_v30.py
          pip install pytest

      - name: Compile
        run: python -m compileall -q app.py modules scripts

      - name: Test
        run: python -m pytest -q

      - name: Security gate
        run: python scripts/security_gate_v30.py

      - name: Architecture gate
        run: python scripts/architecture_gate_v30.py

      - name: Generated code quality gate
        run: python scripts/check_secure_code_gate_v31.py
